name: Deskmate OS

# Builds the Deskmate OS disk image (Debian 13 for a Hyper-V VM) from os-src/,
# boots it in a VM to check it, and puts it on the "os" release.
on:
  push:
    paths: ['os-src/**', '.github/workflows/os.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get update -q
          sudo apt-get install -y -q mmdebstrap debian-archive-keyring gdisk dosfstools e2fsprogs qemu-utils qemu-system-x86 ovmf socat netpbm xz-utils
      - name: Build the image
        run: |
          set -o pipefail
          chmod +x os-src/bin/* os-src/os/*.sh
          mkdir -p out
          sudo os-src/os/build.sh os-src/bin out 2>&1 | tee build.log | grep -v '^Get:\|^Selecting\|^Preparing\|^Unpacking\|^Setting up' | tail -80
      - name: Boot it and check it
        run: sudo os-src/os/test.sh out/deskmate-os.raw results os-src/bin
      - name: Show the results
        if: always()
        run: cat results/results.txt || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$USER" out results
          mkdir pub
          tar -cf - -C out DeskmateOS.vhdx | xz -T0 -6 > pub/DeskmateOS.tar.xz
          cd pub
          sha256sum DeskmateOS.tar.xz | cut -d' ' -f1 > DeskmateOS.tar.xz.sha256
          split -b 1900M -d -a 3 DeskmateOS.tar.xz DeskmateOS.tar.xz.part
          ls DeskmateOS.tar.xz.part* > parts.txt
          rm DeskmateOS.tar.xz
          cp ../results/results.txt tested.txt
          cp ../results/*.png . 2>/dev/null || true
          ls -lh
          gh release delete os --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 5
          gh release create os --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --title "Deskmate OS" \
            --notes "Debian 13 with Deskmate as the desktop, for a Hyper-V VM. Get it with New-DeskmateVM.ps1 (see the repository's front page). Boot-tested before publishing: see tested.txt." \
            DeskmateOS.tar.xz.part* parts.txt DeskmateOS.tar.xz.sha256 tested.txt *.png
