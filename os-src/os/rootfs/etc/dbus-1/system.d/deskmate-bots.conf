<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bots' accounts don't look names up themselves (the filtering proxy does),
     so a lookup can't be used to carry data out. -->
<busconfig>
  <policy group="deskmate-bots">
    <deny send_destination="org.freedesktop.resolve1"/>
  </policy>
</busconfig>
