#!/usr/sbin/nft -f
# Deskmate OS firewall: nothing in unless it's SSH (keys only), the phone link, or a reply.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 accept
    tcp dport 7878-7898 accept
    udp dport { 68, 546, 5353 } accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
}
