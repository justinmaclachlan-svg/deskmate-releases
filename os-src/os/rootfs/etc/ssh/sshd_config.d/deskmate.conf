# Keys only, and never root. Deskmate on the host PC reaches a Bots' account with its key.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

# Bots' accounts reach the internet only through the allowed-sites gate.
Match Group deskmate-bots
    SetEnv HTTPS_PROXY=http://127.0.0.1:8888 HTTP_PROXY=http://127.0.0.1:8888 https_proxy=http://127.0.0.1:8888 http_proxy=http://127.0.0.1:8888 NO_PROXY=localhost,127.0.0.1,::1 no_proxy=localhost,127.0.0.1,::1 NODE_USE_ENV_PROXY=1
Match all
